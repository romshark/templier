name: goreleaser

on:
  push:
    # Run only on tags
    tags:
      - "*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      # Validate the tag's changelog section and compare link before publishing.
      - name: Cut the release notes from CHANGELOG.md
        run: go run ./internal/tools/release-notes -tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
